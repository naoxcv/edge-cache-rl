# Network
num_nodes: 10
num_clusters: 3
intra_cluster_latency_ms: 2
inter_cluster_latency_ms: 20
cloud_latency_ms: 100

# Containers
num_container_types: 20
cache_capacity: 5           # slots per node

# Traffic
zipf_alpha: 1.0
request_rate: 1             # requests per node per timestep
traffic_pattern: "shifting"  # stationary, shifting, bursty
locality_factor: 0.3        # 0=identical node demand, 1=independent rankings
shift_interval: 500         # timesteps between popularity shifts (if shifting)
burst_probability: 0.05     # probability of burst per timestep (if bursty)
burst_multiplier: 10        # demand multiplier during burst

# Reward
reward_local_hit: 1.0
reward_forward_hit: 0.5
reward_cloud_pull: -1.0
comm_penalty_lambda: 0.0    # communication cost coefficient (Level 3+)
# Per cache-action redundancy nudge: -= weight * (# neighbors already holding that container)
overlap_penalty_weight: 0.0

# Communication
comm_level: 0               # 0=none, 1=neighbor_summary, 2=full_neighbor, 3=selective
selective_comm_threshold: 0.1  # Q-margin; 0.01 was tuned for 41-way Q (fires ~3% of 6-action eviction decisions)
enable_forwarding: true         # if false, misses go straight to cloud
forwarding_same_cluster_only: true  # forward + L1–L3 obs peers within cluster only

# Environment
# Action space is Discrete(cache_capacity + 1): evict slot 0..C-1 or reject.
# Observation (local): C×K slot one-hots + util + freq(K) + pending request(K) + needs_decision.
episode_length: 1000
observation_window: 50       # timesteps of request history in state vector

# Training
train_seed: 42
randomize_episode_seeds: true   # new Zipf/catalog seed each episode during training
episode_seed_range: 10000       # traffic seeds sampled from [0, episode_seed_range)
learning_rate: 0.0001
buffer_size: 100000
learning_starts: 5000
batch_size: 128
train_freq: 4                   # env steps between gradient updates
# gradient_steps: unset -> num_nodes for multi-agent (one update per node transition)
gamma: 0.99
target_update_interval: 1000
epsilon_start: 1.0
epsilon_end: 0.01
epsilon_decay_steps: 50000      # used if exploration_fraction unset
exploration_fraction: 0.3       # fraction of total_timesteps for epsilon decay
hidden_layers: [128, 128, 64]
eval_freq: 20000
n_eval_episodes: 5
eval_seeds: [42, 0, 7]          # mean across seeds selects best_model.zip
early_stopping: true
early_stopping_patience: 10     # stop after N evals without a new best (10 × eval_freq steps)
early_stopping_min_evals: 5     # always run at least this many evals first